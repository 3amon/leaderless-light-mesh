# settings-medic: erase the app settings partition (0xec000..0xf4000) and
# hand straight back to the UF2 bootloader. Flashed IN PLACE OF MCUboot
# via the UF2 drive when a brown-out-corrupted NVS crashes every app boot
# before USB comes up; follow with the release combined UF2 to restore.
CONFIG_FLASH=y

# SuperMini clones often omit the 32.768 kHz crystal
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

CONFIG_REBOOT=y
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
