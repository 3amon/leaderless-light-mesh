# ring-test: 16x WS2812B on P0.06, genome patterns from a free-running clock.
# Stage 1 of the TIME-SYNC.md bring-up ladder — no radio yet.

CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_LED_STRIP=y

# SuperMini clones often omit the 32.768 kHz crystal the board target
# assumes; without this the kernel hangs waiting for LFXO startup
# (no timers, no USB, app frozen at first sleep).
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# floating point for the pattern math (nRF52840 has an FPU)
CONFIG_FPU=y

# USB CDC console: debug output + the 1200-baud-touch DFU entry
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="thread-led-node ring-test"
CONFIG_USB_CDC_ACM=y
CONFIG_USB_SELF_POWERED=n
CONFIG_USB_MAX_POWER=250
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_DTE_RATE_CALLBACK_SUPPORT=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_REBOOT=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# UF2 output for the Adafruit bootloader (drag-drop / flash.sh)
CONFIG_BUILD_OUTPUT_UF2=y
