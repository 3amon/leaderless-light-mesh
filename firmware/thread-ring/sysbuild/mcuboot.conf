# MCUboot config for the chainloaded-after-Adafruit-UF2 setup.
# Must fit the 48 kB partition at 0x26000 — no console, no logging, no USB.

# SuperMini clones omit the 32.768 kHz crystal — RC or the kernel hangs.
# (Same gotcha as the app; MCUboot runs the Zephyr kernel too.)
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# Keep it small and quiet
CONFIG_USB_DEVICE_STACK=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n

# A/B swap without a scratch partition
CONFIG_BOOT_SWAP_USING_MOVE=y

# No serial-recovery / USB DFU in MCUboot — the Adafruit bootloader's
# double-tap DFU is the recovery path.
CONFIG_MCUBOOT_SERIAL=n

# Re-validate the primary slot's hash+signature EVERY boot (~1-2s for 350K).
# Round 4 of the 2026-07-18 stress campaign: a swap completed but the swapped
# image crash-looped — the swap itself corrupted a sector (feral flash quirk)
# and MCUboot never re-checks after swapping. With this, a corrupt swap fails
# validation BEFORE boot and reverts cleanly instead of crash-recovering.
# NOTE: MCUboot is NOT OTA-updatable — this lands at the next USB provision.
CONFIG_BOOT_VALIDATE_SLOT0=y

# The application watchdog survives a software reset and a move swap takes
# about 46 seconds on nRF52840. Keep Nordic's direct inherited-WDT feed path
# explicit instead of relying on Kconfig defaults. MCUboot v2.2.0 feeds the
# inherited watchdog between individual flash-sector erases.
CONFIG_BOOT_WATCHDOG_FEED=y
CONFIG_BOOT_WATCHDOG_FEED_NRFX_WDT=y
CONFIG_NRFX_WDT0=y
