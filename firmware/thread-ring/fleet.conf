# Fleet size profile. The base prj.conf remains the bench/debug profile.
#
# Keep USB CDC enabled for 1200-baud UF2 entry, but remove the interactive
# shells and application logging. Fleet diagnostics remain available through
# structured heartbeats and the UDP status/group commands.

CONFIG_SHELL=n
CONFIG_OPENTHREAD_SHELL=n
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n
