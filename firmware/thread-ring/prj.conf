# thread-ring: stage 2 of the TIME-SYNC.md bring-up ladder.
# ring-test + OpenThread FTD joining the existing ring-net mesh, with a
# dashboard-compatible heartbeat. Patterns show Thread state: amber breathe
# while detached, genome families once attached.

CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_LED_STRIP=y

# SuperMini clones omit the 32.768 kHz crystal — RC or the kernel hangs.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# floating point for the pattern math (also required by mbedTLS); the sync
# engine does FP regression in its own thread, so share the FPU context.
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# --- Thread: FTD, rx-on-when-idle, join the existing Thread mesh ---
CONFIG_NETWORKING=y
CONFIG_NET_IPV6=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_L2_OPENTHREAD=y
CONFIG_OPENTHREAD_FTD=y
CONFIG_OPENTHREAD_THREAD_STACK_SIZE=6144
CONFIG_MAIN_STACK_SIZE=6144

# Thread network credentials. PLACEHOLDERS, not a real network: the key is
# the well-known example key 00112233445566778899aabbccddeeff, the PAN ID is
# 0xABCD and the extended PAN ID is the Zephyr default. Replace all three with
# your own before flashing anything you care about, keep the real values out
# of version control, and make them match your border router's dataset.
# See "Network credentials" in the top-level README.
CONFIG_OPENTHREAD_CHANNEL=15
CONFIG_OPENTHREAD_PANID=43981
CONFIG_OPENTHREAD_NETWORK_NAME="ring-net"
CONFIG_OPENTHREAD_NETWORKKEY="00:11:22:33:44:55:66:77:88:99:aa:bb:cc:dd:ee:ff"
CONFIG_OPENTHREAD_XPANID="de:ad:00:be:ef:00:ca:fe"

# persist Thread state across reboots (fast rejoin)
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

# USB CDC console + shell (ot commands!) + the 1200-baud-touch DFU entry
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="thread-led-node thread-ring"
CONFIG_USB_CDC_ACM=y
# The carrier and LED rail are powered from USB VBUS, not from an independent
# self-powered source.  Request the USB 2.0 high-power ceiling so a managed
# host/hub does not keep the ring at the 100 mA default while the strip is on.
CONFIG_USB_SELF_POWERED=n
CONFIG_USB_MAX_POWER=250
# Start USB explicitly from main(), after the LED marker and watchdog.  The
# POST_KERNEL auto-init can wedge before main() after a warm nRF52840 reset.
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
# Defer the driver's synthetic ATTACHED event after an MCUboot handoff. This
# keeps its unbounded hardware READY wait out of the regulator/host transition.
CONFIG_USB_NRFX_ATTACHED_EVENT_DELAY=250
CONFIG_CDC_ACM_DTE_RATE_CALLBACK_SUPPORT=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_REBOOT=y
CONFIG_POWEROFF=y
CONFIG_SHELL=y
CONFIG_OPENTHREAD_SHELL=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

CONFIG_BUILD_OUTPUT_UF2=y

# --- OTA: mcumgr SMP server over UDP :1337, A/B images via MCUboot ---
# Upload with smpmgr/mcumgr from any host that can reach the board's mesh
# address (the Pi). The app confirms itself after it sees border-router
# Network Data; an image that cannot reach infrastructure gets rolled back on
# the next reboot. This means an
# isolated ring-only partition cannot bless an unreachable test image.
# Image version and build identity are generated from Git by the supported
# build entry point; they intentionally do not live in this source config.
CONFIG_ZCBOR=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UDP=y
CONFIG_MCUMGR_TRANSPORT_UDP_IPV6=y
CONFIG_MCUMGR_TRANSPORT_UDP_IPV4=n
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y

# DFU mode: mute own radio chatter + show progress arc during OTA upload
CONFIG_MCUMGR_GRP_IMG_UPLOAD_CHECK_HOOK=y
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_WATCHDOG=y
CONFIG_HWINFO=y

# Battery sense on AIN7 (P0.31) — see boards/*_uf2.overlay for why this is
# experimental on SuperMini clones. The SAADC hardware is already present and
# the board dts enables &adc; this pulls in the driver so it can be read.
CONFIG_ADC=y
