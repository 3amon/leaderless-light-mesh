[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
  ".cache",
  "ci-build",
  "dist",
  "firmware/ring-test/build",
  "firmware/thread-ring/build-*",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = [
  "boot_test",
  "deploy",
  "ringctl",
  "rollback_test",
  "safe_diagnostics",
  "status_telemetry",
]
